<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a237e">
    <title>New Luck Attendance - Complete System</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #1a237e;
            --primary-light: #3949ab;
            --primary-dark: #0d1442;
            --success: #00c853;
            --danger: #ff1744;
            --warning: #ff9100;
            --info: #2979ff;
            --background: #f5f6fa;
            --surface: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #666666;
            --border: #e0e0e0;
            --shadow: 0 2px 10px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-lg: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            overflow-x: hidden;
        }
        
        /* Splash Screen */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a237e 0%, #0d1442 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            animation: splashExit 0.5s ease 2s forwards;
        }
        
        .splash-content { text-align: center; color: white; }
        .splash-logo { font-size: 80px; animation: bounce 1.5s infinite; }
        .splash-title { font-size: 32px; font-weight: 800; margin: 20px 0 10px; letter-spacing: 1px; }
        .splash-subtitle { font-size: 16px; opacity: 0.9; }
        .splash-loader {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto 0;
        }
        
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }
        @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
        @keyframes splashExit { to { opacity: 0; visibility: hidden; } }
        
        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-icon { font-size: 60px; margin-bottom: 15px; }
        .login-title { font-size: 28px; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
        .login-subtitle { font-size: 14px; color: var(--text-secondary); }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text); }
        
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 20px; }
        
        .form-input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 16px;
            transition: var(--transition);
            background: #fafafa;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(26, 35, 126, 0.1);
        }
        
        select.form-input { padding-left: 15px; }
        textarea.form-input { padding-left: 15px; resize: vertical; }
        
        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* App Layout */
        .app-container { display: none; min-height: 100vh; }
        .app-container.active { display: block; }
        
        /* Top Bar */
        .top-bar {
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .menu-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px; }
        .top-title { font-size: 18px; font-weight: 700; color: var(--primary); }
        
        .top-actions { display: flex; gap: 15px; align-items: center; }
        .logout-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: white;
            box-shadow: var(--shadow-lg);
            transition: left 0.3s ease;
            z-index: 200;
            overflow-y: auto;
        }
        .sidebar.active { left: 0; }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        
        .sidebar-avatar {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            margin: 0 auto 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 800;
            border: 3px solid white;
        }
        
        .sidebar-name { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .sidebar-role { font-size: 14px; opacity: 0.9; }
        
        .sidebar-menu { padding: 20px 0; list-style: none; }
        .sidebar-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            border-left: 4px solid transparent;
            transition: var(--transition);
        }
        .sidebar-item:hover { background: #f5f5f5; }
        .sidebar-item.active { background: #e8eaf6; border-left: 4px solid var(--primary); color: var(--primary); font-weight: 600; }
        .sidebar-icon { font-size: 22px; width: 30px; text-align: center; }
        
        .sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 150;
            display: none;
        }
        .sidebar-overlay.active { display: block; }
        
        /* Main Content */
        .main-content { padding: 20px; padding-bottom: 80px; }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .stat-card:active { transform: scale(0.98); }
        .stat-icon { font-size: 28px; margin-bottom: 10px; }
        .stat-value { font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .stat-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        
        /* Cards */
        .card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; }
        
        /* Buttons */
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-info { background: var(--info); color: white; }
        .btn-sm { padding: 8px 12px; font-size: 12px; }
        .btn-block { width: 100%; justify-content: center; }
        
        /* Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
            white-space: nowrap;
        }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        
        /* Employee List */
        .employee-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }
        .employee-info { display: flex; align-items: center; gap: 12px; }
        .employee-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #e8eaf6;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: var(--primary);
        }
        .employee-name { font-weight: 600; }
        .employee-username { font-size: 12px; color: var(--text-secondary); }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 300;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: 30px;
            max-width: 450px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            z-index: 1000;
            display: none;
            box-shadow: var(--shadow-lg);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; animation: slideDown 0.3s; }
        @keyframes slideDown { from { opacity: 0; transform: translate(-50%, -100%); } to { opacity: 1; transform: translate(-50%, 0); } }
        
        /* Calendar */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }
        .calendar-weekday { font-weight: 700; font-size: 12px; color: var(--text-secondary); padding: 10px 0; }
        .calendar-day {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }
        .day-present { background: #e8f5e9; color: #2e7d32; }
        .day-absent { background: #ffebee; color: #c62828; }
        .day-leave { background: #e3f2fd; color: #1565c0; }
        .day-future { background: #fafafa; color: #bdbdbd; }
        
        /* Badge */
        .badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-present { background: #e8f5e9; color: #2e7d32; }
        .badge-absent { background: #ffebee; color: #c62828; }
        .badge-leave { background: #e3f2fd; color: #1565c0; }
        .badge-pending { background: #fff3e0; color: #e65100; }
        .badge-approved { background: #e8f5e9; color: #2e7d32; }
        .badge-rejected { background: #ffebee; color: #c62828; }
        .badge-emergency { background: #ff1744; color: white; }
        
        /* Responsive */
        @media (min-width: 768px) {
            .sidebar { left: 0; }
            .app-container { margin-left: 280px; }
            .menu-btn { display: none; }
            .main-content { max-width: 1000px; margin: 0 auto; }
        }
        
        @media (max-width: 400px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <div class="splash-logo">📸</div>
            <div class="splash-title">New Luck Attendance</div>
            <div class="splash-subtitle">Smart Attendance System</div>
            <div class="splash-loader"></div>
        </div>
    </div>

    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">📸</div>
                <div class="login-title">Welcome Back</div>
                <div class="login-subtitle">Login to mark your attendance</div>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" class="form-input" id="username" placeholder="Enter username" required autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-input" id="password" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>
                
                <button type="submit" class="login-btn" id="loginBtn">Login</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px; font-size: 12px; color: #999;">
                Default HR: hr / admin | Employee: emp1 / 1234
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <!-- Top Bar -->
        <div class="top-bar">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div class="top-title" id="topTitle">Dashboard</div>
            <div class="top-actions">
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar(false)"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-avatar" id="sidebarAvatar">U</div>
                <div class="sidebar-name" id="sidebarName">User</div>
                <div class="sidebar-role" id="sidebarRole">Employee</div>
            </div>
            <ul class="sidebar-menu" id="sidebarMenu"></ul>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Add Employee Modal -->
    <div class="modal" id="addEmployeeModal">
        <div class="modal-content">
            <div class="modal-title">➕ Add Employee</div>
            <form id="addEmployeeForm">
                <div class="form-group">
                    <label class="form-label">Employee Name</label>
                    <input type="text" class="form-input" id="empName" required style="padding-left: 15px;">
                </div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-input" id="empUsername" required style="padding-left: 15px;">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="text" class="form-input" id="empPassword" required style="padding-left: 15px;">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-input" id="empPhone" required style="padding-left: 15px;">
                </div>
                <div class="form-group">
                    <label class="form-label">Daily Salary (₹)</label>
                    <input type="number" class="form-input" id="empSalary" required style="padding-left: 15px;">
                </div>
                <button type="submit" class="btn btn-success btn-block">Add Employee</button>
                <button type="button" class="btn btn-danger btn-block" style="margin-top: 10px;" onclick="closeAddEmployeeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Hidden file input for photos -->
    <input type="file" id="photoInput" accept="image/*" capture="user" style="display:none;">

    <script>
        // ==================== FIREBASE CONFIGURATION ====================
        const firebaseConfig = {
            apiKey: "AIzaSyCNOriYLY3suu4IWocqVmlMoSpIGPwqPwk",
            authDomain: "newluckattendace.firebaseapp.com",
            projectId: "newluckattendace",
            storageBucket: "newluckattendace.firebasestorage.app",
            messagingSenderId: "749927661938",
            appId: "1:749927661938:web:44e8b2a273c428c630ddeb"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        db.enablePersistence({ synchronizeTabs: true })
            .catch(err => console.error("Persistence error:", err));

        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4BkhWgaP7QUyOuwCACKvwitm3wLZ_hAdcTbuSjqM7FUBZutr0iEEipWX8c1UWzqvf/exec";

        // ==================== GLOBAL VARIABLES ====================
        let currentUser = null;
        let currentPage = 'dashboard';
        let selectedDate = new Date();

        const DEFAULT_EMPLOYEES = [
            { id: 'emp001', name: 'John Doe', username: 'emp1', password: '1234', role: 'employee', salary: 500, phone: '9876543210' },
            { id: 'emp002', name: 'Jane Smith', username: 'emp2', password: '1234', role: 'employee', salary: 600, phone: '9876543211' },
            { id: 'emp003', name: 'Bob Johnson', username: 'emp3', password: '1234', role: 'employee', salary: 550, phone: '9876543212' },
            { id: 'emp004', name: 'Alice Brown', username: 'emp4', password: '1234', role: 'employee', salary: 700, phone: '9876543213' },
            { id: 'emp005', name: 'Charlie Davis', username: 'emp5', password: '1234', role: 'employee', salary: 450, phone: '9876543214' },
            { id: 'hr001', name: 'HR Manager', username: 'hr', password: 'admin', role: 'hr', salary: 1000, phone: '9876543299' }
        ];

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', async () => {
            await seedEmployees();
            checkAutoLogin();
        });

        async function seedEmployees() {
            try {
                const snapshot = await db.collection('employees').get();
                if (snapshot.empty) {
                    const batch = db.batch();
                    DEFAULT_EMPLOYEES.forEach(emp => {
                        batch.set(db.collection('employees').doc(emp.id), emp);
                    });
                    await batch.commit();
                    console.log('✅ Default employees seeded');
                }
            } catch (error) {
                console.error('Seeding error:', error);
            }
        }

        function checkAutoLogin() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showApp();
            }
        }

        // ==================== LOGIN ====================
        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        async function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';
            
            try {
                const snapshot = await db.collection('employees')
                    .where('username', '==', username)
                    .where('password', '==', password)
                    .get();
                
                if (!snapshot.empty) {
                    currentUser = { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showToast('Welcome, ' + currentUser.name + '!');
                    showApp();
                } else {
                    showToast('❌ Invalid username or password');
                }
            } catch (error) {
                console.error('Login error:', error);
                showToast('❌ Login failed. Check connection.');
            }
            
            loginBtn.disabled = false;
            loginBtn.textContent = 'Login';
        }

        function showApp() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appContainer').classList.add('active');
            
            const initials = getInitials(currentUser.name);
            document.getElementById('sidebarAvatar').textContent = initials;
            document.getElementById('sidebarName').textContent = currentUser.name;
            document.getElementById('sidebarRole').textContent = currentUser.role === 'hr' ? 'HR Manager' : 'Employee';
            
            buildNavigation();
            showPage('dashboard');
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('appContainer').classList.remove('active');
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('password').value = '';
            showToast('Logged out');
        }

        function getInitials(name) {
            return name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
        }

        // ==================== NAVIGATION ====================
        function buildNavigation() {
            const menu = document.getElementById('sidebarMenu');
            
            if (currentUser.role === 'hr') {
                menu.innerHTML = `
                    <li class="sidebar-item active" onclick="showPage('dashboard')">
                        <span class="sidebar-icon">📊</span> Dashboard
                    </li>
                    <li class="sidebar-item" onclick="showPage('employees')">
                        <span class="sidebar-icon">👥</span> Manage Employees
                    </li>
                    <li class="sidebar-item" onclick="showPage('leaveRequests')">
                        <span class="sidebar-icon">🏖️</span> Leave Requests
                    </li>
                    <li class="sidebar-item" onclick="showPage('notPresent')">
                        <span class="sidebar-icon">❌</span> Not Present
                    </li>
                    <li class="sidebar-item" onclick="showPage('salary')">
                        <span class="sidebar-icon">💰</span> Salary Calculator
                    </li>
                `;
            } else {
                menu.innerHTML = `
                    <li class="sidebar-item active" onclick="showPage('dashboard')">
                        <span class="sidebar-icon">📊</span> Dashboard
                    </li>
                    <li class="sidebar-item" onclick="showPage('attendance')">

        function showPage(page) {
            currentPage = page;
            document.getElementById('topTitle').textContent = getPageTitle(page);
            
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            const items = document.querySelectorAll('.sidebar-item');
            const index = getPageIndex(page);
            if (items[index]) items[index].classList.add('active');
            
            toggleSidebar(false);
            
            if (currentUser.role === 'hr') {
                switch(page) {
                    case 'dashboard': showHRDashboard(); break;
                    case 'employees': showEmployeeManagement(); break;
                    case 'leaveRequests': showLeaveRequests(); break;
                    case 'notPresent': showNotPresentList(); break;
                    case 'salary': showSalaryCalculator(); break;
                }
            } else {
                switch(page) {
                    case 'dashboard': showEmployeeDashboard(); break;
                    case 'attendance': showAttendanceCalendar(); break;
                    case 'leaveRequest': showLeaveRequestForm(); break;
                    case 'outsideWork': showOutsideWorkForm(); break;
                }
            }
        }

        function getPageTitle(page) {
            const titles = {
                dashboard: currentUser.role === 'hr' ? 'HR Dashboard' : 'My Dashboard',
                employees: 'Manage Employees',
                leaveRequests: 'Leave Requests',
                notPresent: 'Not Present List',
                salary: 'Salary Calculator',
                attendance: 'My Attendance',
                leaveRequest: 'Leave Request',
                outsideWork: 'Outside Work'
            };
            return titles[page] || 'Dashboard';
        }

        function getPageIndex(page) {
            const pages = currentUser.role === 'hr' 
                ? ['dashboard', 'employees', 'leaveRequests', 'notPresent', 'salary']
                : ['dashboard', 'attendance', 'leaveRequest', 'outsideWork'];
            return pages.indexOf(page);
        }

        function toggleSidebar(forceClose = null) {
            const sidebar = document.getElementById('sidebar');

                overlay.classList.remove('active');

            }

        async function calculateEmployeeSalary() {
            const employeeSelect = document.getElementById('salaryEmployee');
            const periodSelect = document.getElementById('salaryPeriod');
            
            if (!employeeSelect.value) return;
            
            const employeeId = employeeSelect.value;
            const employeeName = employeeSelect.options[employeeSelect.selectedIndex].dataset.name;
            const dailySalary = parseInt(employeeSelect.options[employeeSelect.selectedIndex].dataset.salary);
            const period = periodSelect.value;
            
            try {
                const snapshot = await db.collection('attendance').where('employeeId', '==', employeeId).get();
                const records = [];
                snapshot.forEach(doc => records.push(doc.data()));
                
                let presentDays = 0;
                const now = new Date();
                
                if (period === 'daily') {
                    const today = now.toISOString().split('T')[0];
                    presentDays = records.filter(r => r.date === today && r.status === 'present').length;
                } else if (period === 'weekly') {
                    const weekStart = new Date(now);
                    weekStart.setDate(now.getDate() - 7);
                    const weekStartStr = weekStart.toISOString().split('T')[0];
                    presentDays = records.filter(r => r.date >= weekStartStr && r.status === 'present').length;
                } else {
                    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                    const monthStartStr = monthStart.toISOString().split('T')[0];
                    presentDays = records.filter(r => r.date >= monthStartStr && r.status === 'present').length;
                }
                
                const totalSalary = presentDays * dailySalary;
                
                document.getElementById('salaryResult').style.display = 'block';
                document.getElementById('salaryDetails').innerHTML = `
                    <h3 style="margin-bottom: 15px;">${employeeName}</h3>
                    <p><strong>Period:</strong> ${period.toUpperCase()}</p>
                    <p><strong>Present Days:</strong> ${presentDays}</p>
                    <p><strong>Daily Rate:</strong> ₹${dailySalary}</p>
                    <hr style="margin: 15px 0; border: 1px solid #e0e0e0;">
                    <h3 style="color: #00c853;">Total Salary: ₹${totalSalary.toFixed(2)}</h3>
                `;
            } catch (error) {
                console.error('Salary calculation error:', error);
                showToast('Error calculating salary');
            }
        }

        // ==================== CHECK IN / CHECK OUT ====================
        async function checkIn() {
            try {
                document.getElementById('photoInput').click();
                
                document.getElementById('photoInput').onchange = async function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        showToast('📸 Uploading photo...');
                        const reader = new FileReader();
                        reader.onload = async function(event) {
                            const photoData = event.target.result;
                            
                            try {
                                const base64Data = photoData.split(',')[1];
                                await fetch(GOOGLE_APPS_SCRIPT_URL, {
                                    method: 'POST',
                                    mode: 'no-cors',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        photo: base64Data,
                                        employeeId: currentUser.id,
                                        employeeName: currentUser.name,
                                        photoType: 'checkin',
                                        attendanceDate: new Date().toISOString().split('T')[0],
                                        mimeType: 'image/jpeg'
                                    })
                                });
                            } catch (uploadError) {
                                console.error('Upload error:', uploadError);
                            }
                            
                            const today = new Date().toISOString().split('T')[0];
                            await db.collection('attendance').add({
                                employeeId: currentUser.id,
                                employeeName: currentUser.name,
                                date: today,
                                checkInTime: new Date().toLocaleTimeString(),
                                status: 'present',
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            });
                            
                            showToast('✅ Checked in successfully!');
                            showEmployeeDashboard();
                        };
                        reader.readAsDataURL(file);
                    }
                };
            } catch (error) {
                console.error('Check-in error:', error);
                showToast('❌ Check-in failed');
            }
        }

        async function checkOut() {
            try {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('photoInput').click();
                
                document.getElementById('photoInput').onchange = async function(e) {
                    const file = e.target.files[0];

                        const reader = new FileReader();
                        reader.onload = async function(event) {
                            const photoData = event.target.result;
                            
                            try {
                                const base64Data = photoData.split(',')[1];
                                await fetch(GOOGLE_APPS_SCRIPT_URL, {
                                    method: 'POST',
                                    mode: 'no-cors',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({
                                        photo: base64Data,
                                        employeeId: currentUser.id,

                                        mimeType: 'image/jpeg'
                                    })

                            }
                            
                            showToast('✅ Checked out successfully!');
                            showEmployeeDashboard();
                        };
                        reader.readAsDataURL(file);
                    }
                };
            } catch (error) {
                console.error('Check-out error:', error);
                showToast('❌ Check-out failed');
            }
        }

        // ==================== ATTENDANCE CALENDAR ====================
        function showAttendanceCalendar() {
            const mainContent = document.getElementById('mainContent');
            
            db.collection('attendance').where('employeeId', '==', currentUser.id).get()
                .then(snapshot => {
                    const records = [];
                    snapshot.forEach(doc => records.push(doc.data()));
                    
                    const year = selectedDate.getFullYear();
                    const month = selectedDate.getMonth();
                    const monthRecords = records.filter(r => {
                        const d = new Date(r.date);
                        return d.getFullYear() === year && d.getMonth() === month;
                    });
                    
                    const firstDay = new Date(year, month, 1).getDay();
                    const daysInMonth = new Date(year, month + 1, 0).getDate();
                    
                    let html = `
                        <div class="card">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                                <h3>${selectedDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h3>
                                <div style="display: flex; gap: 10px;">
                                    <button class="btn btn-sm" onclick="changeMonth(-1)">◀</button>
                                    <button class="btn btn-sm" onclick="changeMonth(1)">▶</button>
                                </div>
                            </div>
                            <div class="calendar-grid">
                                <div class="calendar-weekday">Sun</div>
                                <div class="calendar-weekday">Mon</div>
                                <div class="calendar-weekday">Tue</div>
                                <div class="calendar-weekday">Wed</div>
                                <div class="calendar-weekday">Thu</div>
                                <div class="calendar-weekday">Fri</div>
                                <div class="calendar-weekday">Sat</div>
                    `;
                    
                    for (let i = 0; i < firstDay; i++) html += '<div></div>';
                    
                    for (let day = 1; day <= daysInMonth; day++) {
                        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                        const record = monthRecords.find(r => r.date === dateStr);
                        let cls = 'day-future';
                        let content = day;
                        
                        if (record) {
                            if (record.status === 'present') { cls = 'day-present'; content = 'P'; }
                            else if (record.status === 'leave') { cls = 'day-leave'; content = 'L'; }
                            else { cls = 'day-absent'; content = 'A'; }
                        } else if (dateStr < new Date().toISOString().split('T')[0]) {
                            cls = 'day-absent'; content = 'A';
                        }
                        
                        html += `<div class="calendar-day ${cls}">${content}</div>`;
                    }
                    
                    html += `
                            </div>
                            <div style="margin-top: 20px; display: flex; gap: 15px; font-size: 13px; flex-wrap: wrap;">
                                <span>✅ P = Present</span>
                                <span>❌ A = Absent</span>
                                <span>🏖️ L = Leave</span>
                            </div>
                        </div>
                    `;
                    
                    mainContent.innerHTML = html;
                })
                .catch(error => {
                    console.error('Calendar error:', error);
                    showToast('Error loading calendar');
                });
        }

        function changeMonth(delta) {
            selectedDate = new Date(selectedDate.getFullYear(), selectedDate.getMonth() + delta, 1);
            showAttendanceCalendar();
        }

        // ==================== LEAVE REQUEST FORM ====================
        function showLeaveRequestForm() {
            const mainContent = document.getElementById('mainContent');
            
            mainContent.innerHTML = `
                <div class="card">
                    <div class="card-title">🏖️ Apply for Leave</div>
                    <div class="form-group">
                        <label class="form-label">Leave Type</label>
                        <select class="form-input" id="leaveType" style="padding-left: 15px;">
                            <option value="">Select type</option>
                            <option value="planned">Planned Leave (Function/Event)</option>
                            <option value="emergency">Emergency Leave (Hospital)</option>
                            <option value="sick">Sick Leave</option>
                            <option value="family">Family Event</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" class="form-input" id="leaveDate" style="padding-left: 15px;">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Reason</label>
                        <textarea class="form-input" id="leaveReason" rows="4" placeholder="Enter reason for leave" style="padding-left: 15px;"></textarea>
                    </div>
                    <button class="btn btn-warning btn-block" onclick="submitLeaveRequest()">Submit Leave Request</button>
                </div>
            `;
        }

        async function submitLeaveRequest() {
            const leaveType = document.getElementById('leaveType').value;
            const leaveDate = document.getElementById('leaveDate').value;
            const leaveReason = document.getElementById('leaveReason').value;
            
            if (!leaveType || !leaveDate || !leaveReason) {
                showToast('❌ Please fill all fields');
                return;
            }
            
            try {
                await db.collection('leaveRequests').add({
                    employeeId: currentUser.id,
                    employeeName: currentUser.name,
                    leaveType: leaveType,
                    leaveDate: leaveDate,
                    reason: leaveReason,
                    status: 'pending',
                    isEmergency: leaveType === 'emergency',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showToast('✅ Leave request submitted!');
                showPage('dashboard');
            } catch (error) {
                console.error('Leave request error:', error);
                showToast('❌ Failed to submit leave request');
            }
        }

        // ==================== OUTSIDE WORK ====================
        function showOutsideWorkForm() {
            const mainContent = document.getElementById('mainContent');
            
            mainContent.innerHTML = `
                <div class="card">
                    <div class="card-title">📸 Outside Work</div>
                    <div class="form-group">
                        <label class="form-label">Reason</label>
                        <select class="form-input" id="outsideReason" style="padding-left: 15px;">
                            <option value="">Select reason</option>
                            <option value="client">Client Visit</option>
                            <option value="delivery">Delivery</option>
                            <option value="purchase">Purchase Materials</option>
                            <option value="bank">Bank Work</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea class="form-input" id="outsideDescription" rows="3" placeholder="Enter details" style="padding-left: 15px;"></textarea>
                    </div>
                    <button class="btn btn-info btn-block" onclick="uploadOutsidePhoto()">📸 Take Photo & Submit</button>
                </div>
            `;
        }

        async function uploadOutsidePhoto() {
            const reason = document.getElementById('outsideReason').value;
            const description = document.getElementById('outsideDescription').value;
            
            if (!reason) {
                showToast('❌ Please select reason');
                return;
            }
            
            document.getElementById('photoInput').click();
            
            document.getElementById('photoInput').onchange = async function(e) {
                const file = e.target.files[0];
                if (file) {
                    showToast('📸 Uploading photo...');
                    const reader = new FileReader();
                    reader.onload = async function(event) {
                        const photoData = event.target.result;
                        
                        try {
                            const base64Data = photoData.split(',')[1];
                            await fetch(GOOGLE_APPS_SCRIPT_URL, {
                                method: 'POST',
                                mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    photo: base64Data,
                                    employeeId: currentUser.id,
                                    employeeName: currentUser.name,
                                    photoType: 'outside',
                                    attendanceDate: new Date().toISOString().split('T')[0],
                                    mimeType: 'image/jpeg'
                                })
                            });
                        } catch (uploadError) {
                            console.error('Upload error:', uploadError);
                        }
                        
                        await db.collection('outsideWork').add({
                            employeeId: currentUser.id,
                            employeeName: currentUser.name,
                            reason: reason,
                            description: description,
                            startTime: new Date().toLocaleTimeString(),
                            date: new Date().toISOString().split('T')[0],
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        
                        showToast('✅ Outside work logged!');
                        showPage('dashboard');
                    };
                    reader.readAsDataURL(file);
                }
            };
        }
    </script>
