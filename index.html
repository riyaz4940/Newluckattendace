<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1b4b">
    <title>AttendPro - Complete Attendance System</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4338ca;
            --primary-dark: #1e1b4b;
            --accent: #0891b2;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --info: #2563eb;
            --bg: #f4f5f9;
            --surface: #ffffff;
            --text: #111827;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --shadow: 0 1px 2px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
            --shadow-lg: 0 20px 50px rgba(15,23,42,0.12);
            --radius: 14px;
        }
        
        [data-theme="dark"] {
            --primary: #818cf8;
            --primary-dark: #0b0e1a;
            --accent: #22d3ee;
            --bg: #0b0f1a;
            --surface: #151b2b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #26304a;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.55);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.3s;
        }
        
        .splash {
            position: fixed; inset: 0; z-index: 9999;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            display: flex; align-items: center; justify-content: center;
            animation: fadeOut 0.5s ease 2s forwards;
        }
        .splash-inner { text-align: center; color: white; }
        .splash-icon { font-size: 80px; animation: pulse 1.5s infinite; }
        .splash-title { font-size: 28px; font-weight: 900; margin: 20px 0; }
        .splash-loader { width: 50px; height: 5px; background: rgba(255,255,255,0.3); border-radius: 3px; margin: 30px auto 0; overflow: hidden; }
        .splash-loader::after { content: ''; display: block; width: 50%; height: 100%; background: white; animation: load 1s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
        @keyframes load { 0%{transform:translateX(-100%)} 100%{transform:translateX(200%)} }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        
        .login-screen {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px; background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }
        .login-card {
            background: var(--surface); border-radius: 24px; padding: 40px 35px;
            max-width: 420px; width: 100%; box-shadow: var(--shadow-lg);
        }
        .login-logo { font-size: 60px; text-align: center; margin-bottom: 20px; }
        .login-title { text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 5px; }
        .login-sub { text-align: center; color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-input {
            width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 12px;
            font-size: 15px; font-family: inherit; background: var(--bg); color: var(--text);
        }
        .form-input:focus { outline: none; border-color: var(--primary); }
        .login-btn {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white;
            font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
        }
        
        .app { display: none; min-height: 100vh; }
        .app.active { display: block; }
        
        .header {
            background: var(--surface); padding: 14px 24px; display: flex; align-items: center;
            justify-content: space-between; position: sticky; top: 0; z-index: 100;
            box-shadow: var(--shadow); border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .hamburger { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text); }
        .header-title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .theme-btn {
            background: var(--bg); border: 1px solid var(--border); width: 38px; height: 38px;
            border-radius: 10px; cursor: pointer; font-size: 16px;
        }
        .logout-btn {
            background: rgba(220,38,38,0.08); color: var(--danger); border: 1px solid rgba(220,38,38,0.25);
            padding: 8px 14px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 13px;
        }
        
        .sidebar {
            position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
            background: var(--surface); z-index: 200; transition: left 0.3s;
            box-shadow: var(--shadow-lg); overflow-y: auto; border-right: 1px solid var(--border);
        }
        .sidebar.active { left: 0; }
        .sidebar-header {
            background: linear-gradient(150deg, var(--primary-dark), var(--primary) 130%);
            padding: 32px 20px 26px; text-align: center; color: white;
        }
        .sidebar-brand { font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; margin-bottom: 18px; }
        .sidebar-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(255,255,255,0.15); margin: 0 auto 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 800; border: 2px solid rgba(255,255,255,0.5);
        }
        .sidebar-name { font-size: 16px; font-weight: 700; }
        .sidebar-role { font-size: 11px; opacity: 0.75; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
        .sidebar-menu { padding: 14px 0; list-style: none; }
        .menu-item {
            padding: 12px 18px; margin: 2px 10px; display: flex; align-items: center;
            gap: 12px; cursor: pointer; border-radius: 10px; font-size: 13.5px;
            font-weight: 500; color: var(--text-secondary); transition: all 0.15s;
        }
        .menu-item:hover { background: var(--bg); color: var(--text); }
        .menu-item.active { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: white; box-shadow: 0 4px 14px rgba(67,56,202,0.35); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 150; display: none; backdrop-filter: blur(2px); }
        .sidebar-overlay.active { display: block; }
        
        .main { padding: 22px; padding-bottom: 100px; max-width: 1100px; margin: 0 auto; }
        
        .hero {
            background: linear-gradient(150deg, var(--primary-dark), var(--primary) 130%);
            border-radius: 20px; padding: 28px 26px; margin-bottom: 22px;
            color: white; box-shadow: 0 12px 30px rgba(30,27,75,0.25);
        }
        .hero-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.01em; }
        .hero-sub { font-size: 13.5px; opacity: 0.85; }
        .hero-time { font-size: 36px; font-weight: 800; margin-top: 14px; letter-spacing: -0.02em; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card {
            background: var(--surface); border-radius: var(--radius); padding: 16px 18px;
            box-shadow: var(--shadow); border: 1px solid var(--border); transition: transform 0.15s, box-shadow 0.15s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .stat-icon {
            font-size: 18px; margin-bottom: 12px; width: 36px; height: 36px; border-radius: 10px;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
        }
        .stat-value { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
        .stat-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.03em; }
        
        .card {
            background: var(--surface); border-radius: var(--radius); padding: 20px;
            box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 16px;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .card-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
        
        .btn {
            padding: 11px 18px; border: none; border-radius: 10px; font-size: 13.5px;
            font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit;
            box-shadow: 0 1px 2px rgba(15,23,42,0.08);
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-info { background: var(--info); color: white; }
        .btn-block { width: 100%; justify-content: center; padding: 14px; font-size: 15px; }
        .btn-sm { padding: 6px 10px; font-size: 11px; border-radius: 6px; }
        
        .badge {
            display: inline-flex; padding: 4px 11px; border-radius: 20px;
            font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em;
        }
        .badge-present { background: rgba(5,150,105,0.12); color: var(--success); }
        .badge-absent { background: rgba(220,38,38,0.12); color: var(--danger); }
        .badge-pending { background: rgba(217,119,6,0.12); color: var(--warning); }
        .badge-emergency { background: var(--danger); color: white; }
        .badge-half { background: rgba(217,119,6,0.12); color: var(--warning); }
        .badge-leave { background: rgba(37,99,235,0.12); color: var(--info); }
        
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            background: var(--bg); padding: 11px 12px; text-align: left;
            font-size: 10.5px; font-weight: 700; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 2px solid var(--border);
        }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
        tbody tr { transition: background 0.1s; }
        tbody tr:hover { background: var(--bg); }
        
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-week { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-secondary); padding: 8px 0; }
        .cal-day {
            aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 12px; font-weight: 600;
        }
        .cal-present { background: rgba(16,185,129,0.2); color: #10b981; }
        .cal-absent { background: rgba(239,68,68,0.2); color: #ef4444; }
        .cal-half { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .cal-leave { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .cal-future { background: var(--bg); color: var(--text-secondary); }
        .cal-today { border: 2px solid var(--primary); }
        
        .photo-thumb { width: 50px; height: 50px; border-radius: 8px; cursor: pointer; object-fit: cover; }
        .photo-modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            z-index: 300; align-items: center; justify-content: center;
        }
        .photo-modal.active { display: flex; }
        .photo-modal img { max-width: 90%; max-height: 90%; border-radius: 15px; }
        .camera-container { background: #000; border-radius: var(--radius); overflow: hidden; margin-bottom: 15px; }
        .camera-container video { width: 100%; max-height: 400px; object-fit: cover; display: block; }
        
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: var(--surface); color: var(--text); padding: 15px 25px; border-radius: 12px;
            font-size: 14px; font-weight: 600; z-index: 9999; display: none;
            box-shadow: var(--shadow-lg); max-width: 90%; border: 1px solid var(--border);
        }
        .toast.show { display: block; animation: toastIn 0.3s ease; }
        @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
        
        @media (min-width: 768px) {
            .sidebar { left: 0; }
            .app { margin-left: 300px; }
            .hamburger { display: none; }
        }
    </style>
</head>
<body>

<div class="splash" id="splash">
    <div class="splash-inner">
        <div class="splash-icon">📸</div>
        <div class="splash-title">AttendPro</div>
        <div class="splash-loader"></div>
    </div>
</div>

<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <div class="login-logo">📸</div>
        <div class="login-title">Welcome Back</div>
        <div class="login-sub">Sign in to continue</div>
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="username" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" required>
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        <p style="text-align:center;font-size:12px;color:var(--text-secondary);margin-top:15px;">Owner: owner/owner123 | HR: hr/admin | Emp: emp1/1234</p>
    </div>
</div>

<div class="app" id="app">
    <div class="header">
        <div class="header-left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <span class="header-title" id="pageTitle">Dashboard</span>
        </div>
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>
    
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar(false)"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">📸 AttendPro</div>
            <div class="sidebar-avatar" id="avatar">U</div>
            <div class="sidebar-name" id="userName">User</div>
            <div class="sidebar-role" id="userRole">Role</div>
        </div>
        <ul class="sidebar-menu" id="menu"></ul>
    </div>
    
    <div class="main" id="mainContent"></div>
</div>

<div class="toast" id="toast"></div>
<div class="photo-modal" id="photoModal" onclick="this.classList.remove('active')"><img id="photoModalImg" src=""></div>
<input type="file" id="photoInput" accept="image/*" capture="user" style="display:none;">
<input type="file" id="galleryInput" accept="image/*" style="display:none;">

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyCNOriYLY3suu4IWocqVmlMoSpIGPwqPwk",
    authDomain: "newluckattendace.firebaseapp.com",
    projectId: "newluckattendace",
    storageBucket: "newluckattendace.firebasestorage.app",
    messagingSenderId: "749927661938",
    appId: "1:749927661938:web:44e8b2a273c428c630ddeb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2uz_2GItZPg1i7Umtg7WhzuJrARmwTJmBbgxyj1vGroe3JmErjyFdxiOgDobIV-gb/exec";

let currentUser = null;
let selectedMonth = new Date();
let mediaStream = null;
let photoAction = null;

function toggleTheme() {
    const b = document.body, btn = document.getElementById('themeBtn');
    if (b.getAttribute('data-theme') === 'dark') {
        b.removeAttribute('data-theme'); btn.textContent = '🌙'; localStorage.setItem('theme', 'light');
    } else {
        b.setAttribute('data-theme', 'dark'); btn.textContent = '☀️'; localStorage.setItem('theme', 'dark');
    }
}
if (localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');

document.getElementById('loginForm').addEventListener('submit', handleLogin);
document.addEventListener('DOMContentLoaded', checkAutoLogin);

function checkAutoLogin() {
    const s = localStorage.getItem('currentUser');
    if (s) { currentUser = JSON.parse(s); showApp(); }
}

async function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    
    if (u === 'owner' && p === 'owner123') {
        currentUser = { id: 'owner001', name: 'Business Owner', username: 'owner', role: 'owner', salary: 0, phone: '' };
        localStorage.setItem('currentUser', JSON.stringify(currentUser));
        showApp(); return;
    }
    
    try {
        const snap = await db.collection('employees').get();
        let found = null;
        snap.forEach(doc => {
            const emp = doc.data();
            if (emp.username === u && emp.password === p) found = { id: doc.id, ...emp };
        });
        if (found) { currentUser = found; localStorage.setItem('currentUser', JSON.stringify(currentUser)); showApp(); }
        else { showToast('Invalid credentials'); }
    } catch (err) { showToast('Login error'); }
}

function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').classList.add('active');
    document.getElementById('avatar').textContent = currentUser.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    document.getElementById('userName').textContent = currentUser.name;
    document.getElementById('userRole').textContent = currentUser.role === 'owner' ? 'Owner' : currentUser.role === 'hr' ? 'HR Manager' : 'Employee';
    buildMenu();
    if (currentUser.role === 'owner') showOwnerDashboard();
    else if (currentUser.role === 'hr') showHRDashboard();
    else showEmpDashboard();
}

function buildMenu() {
    const m = document.getElementById('menu');
    if (currentUser.role === 'owner') {
        m.innerHTML = `
            <li class="menu-item active" onclick="showOwnerDashboard()"><span>👑</span> Dashboard</li>
            <li class="menu-item" onclick="showHRReview()"><span>👤</span> HR Attendance</li>
            <li class="menu-item" onclick="showTopPerformers()"><span>🏆</span> Top Performers</li>
            <li class="menu-item" onclick="showSalaryReport('daily')"><span>💰</span> Daily Wages</li>
            <li class="menu-item" onclick="showSalaryReport('weekly')"><span>📅</span> Weekly Wages</li>
            <li class="menu-item" onclick="showSalaryReport('monthly')"><span>🗓️</span> Monthly Wages</li>
            <li class="menu-item" onclick="showManageEmployees()"><span>👥</span> Manage Employees</li>
            <li class="menu-item" onclick="showLeaveRequests()"><span>🏖️</span> Leave Requests</li>`;
    } else if (currentUser.role === 'hr') {
        m.innerHTML = `
            <li class="menu-item active" onclick="showHRDashboard()"><span>📊</span> My Dashboard</li>
            <li class="menu-item" onclick="showNotifications()"><span>🔔</span> Notifications</li>
            <li class="menu-item" onclick="showTodayAttendance()"><span>✅</span> Today's Attendance</li>
            <li class="menu-item" onclick="showPhotoAudit()"><span>📸</span> Photo Audit</li>
            <li class="menu-item" onclick="showMonthlyReport()"><span>📅</span> Monthly Report</li>
            <li class="menu-item" onclick="showSalaryCalc()"><span>💰</span> Salary Calculator</li>
            <li class="menu-item" onclick="showLeaveRequests()"><span>🏖️</span> Leave Requests</li>
            <li class="menu-item" onclick="showManageEmployees()"><span>👥</span> Manage Employees</li>`;
    } else {
        m.innerHTML = `
            <li class="menu-item active" onclick="showEmpDashboard()"><span>📊</span> My Dashboard</li>
            <li class="menu-item" onclick="showMyAlerts()"><span>🔔</span> My Alerts</li>
            <li class="menu-item" onclick="showHelp()"><span>📖</span> Guidelines</li>
            <li class="menu-item" onclick="showLeaveForm()"><span>🏖️</span> Leave Request</li>`;
    }
}

function toggleSidebar(force) {
    const s = document.getElementById('sidebar'), o = document.getElementById('overlay');
    if (force === false) { s.classList.remove('active'); o.classList.remove('active'); }
    else { s.classList.toggle('active'); o.classList.toggle('active'); }
}

function logout() {
    currentUser = null;
    localStorage.removeItem('currentUser');
    document.getElementById('app').classList.remove('active');
    document.getElementById('loginScreen').style.display = 'flex';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function setTitle(t) { const el = document.getElementById('pageTitle'); if (el) el.textContent = t; }

function renderError(err, context) {
    console.error('AttendPro error in ' + context + ':', err);
    const main = document.getElementById('mainContent');
    if (main) {
        main.innerHTML = `<div class="card" style="border:2px solid var(--danger);">
            <div class="card-header"><span class="card-title" style="color:var(--danger);">⚠️ Couldn't load this page</span></div>
            <p style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;">Something went wrong while loading <strong>${context}</strong>. This is usually a Firestore permissions or connection issue.</p>
            <p style="font-size:12px;font-family:monospace;background:var(--bg);padding:10px;border-radius:8px;word-break:break-word;">${(err && err.message) ? err.message : String(err)}</p>
            <button class="btn btn-info btn-block" style="margin-top:12px;" onclick="location.reload()">🔄 Reload</button>
        </div>`;
    }
    showToast('⚠️ Error loading ' + context);
}

function calcHours(inT, outT) {
    if (!inT || !outT) return 0;
    const d = new Date().toDateString();
    const diff = new Date(d + ' ' + outT) - new Date(d + ' ' + inT);
    return diff > 0 ? diff / 3600000 : 0;
}

function callEmp(phone) { if (phone) window.location.href = 'tel:' + phone; }
function viewPhoto(url) { document.getElementById('photoModalImg').src = url; document.getElementById('photoModal').classList.add('active'); }
function isLate(t) { if (!t) return false; return new Date('2000-01-01 ' + t) > new Date('2000-01-01 10:30'); }
function isEarlyLogout(t) { if (!t) return false; return new Date('2000-01-01 ' + t) < new Date('2000-01-01 19:00'); }

// ==================== CAMERA FUNCTIONS ====================
async function openCamera(type) {
    photoAction = type;
    const main = document.getElementById('mainContent');
    const label = type === 'checkin' ? 'Check In' : type === 'checkout' ? 'Check Out' : 'Lunch';
    main.innerHTML = `
        <div class="card">
            <div class="card-header"><span class="card-title">📸 ${label} Photo</span></div>
            <div class="camera-container"><video id="videoElement" autoplay playsinline></video></div>
            <button class="btn btn-success btn-block" onclick="capturePhoto()">📸 Capture</button>
            <button class="btn btn-info btn-block" style="margin-top:10px;" onclick="openGallery()">🖼️ Gallery</button>
            <button class="btn btn-danger btn-block" style="margin-top:10px;" onclick="showEmpDashboard()">Cancel</button>
        </div>`;
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
        document.getElementById('videoElement').srcObject = mediaStream;
    } catch (e) { showToast('Camera denied. Use gallery.'); }
}

function openGallery() {
    document.getElementById('galleryInput').click();
    document.getElementById('galleryInput').onchange = async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(ev) { await completePhoto(ev.target.result); };
        reader.readAsDataURL(file);
    };
}

async function capturePhoto() {
    const video = document.getElementById('videoElement');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const photoData = canvas.toDataURL('image/jpeg', 0.8);
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    await completePhoto(photoData);
}

async function completePhoto(photoData) {
    const type = photoAction, today = new Date().toISOString().split('T')[0], time = new Date().toLocaleTimeString();
    showToast('⬆️ Uploading photo...');
    let driveUrl = null;
    try {
        if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('YOUR_') ) {
            throw new Error('APPS_SCRIPT_URL is not set to your deployed Apps Script URL');
        }
        const base64 = photoData.split(',')[1];
        // Sent as text/plain to avoid a CORS preflight (Apps Script doesn't handle OPTIONS requests).
        // See the companion Apps Script (Code.gs) that must be deployed for this to return a Drive URL.
        const resp = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ photo: base64, employeeId: currentUser.id, employeeName: currentUser.name, photoType: type, attendanceDate: today, mimeType: 'image/jpeg' })
        });
        if (!resp.ok) throw new Error('Apps Script responded with HTTP ' + resp.status);
        const result = await resp.json();
        if (result && result.success === false) throw new Error('Apps Script error: ' + (result.error || 'unknown'));
        if (result && result.url) driveUrl = result.url;
        else throw new Error('Apps Script response had no url field: ' + JSON.stringify(result));
    } catch (e) {
        console.error('Drive upload failed:', e);
        showToast('⚠️ Photo not saved to Drive: ' + e.message);
    }

    // driveUrl is what gets stored in Firestore. If the upload failed, we still record
    // attendance (time is what matters most) but flag it so HR can spot missing photos.
    if (type === 'checkin') {
        await db.collection('attendance').add({ employeeId: currentUser.id, employeeName: currentUser.name, date: today, checkInTime: time, checkInPhoto: driveUrl, status: 'present', isLate: isLate(time), timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        showToast(isLate(time) ? '⚠️ Late check-in!' : '✅ Checked in!');
    } else if (type === 'checkout') {
        const snap = await db.collection('attendance').where('employeeId', '==', currentUser.id).where('date', '==', today).get();
        if (!snap.empty) { await snap.docs[0].ref.update({ checkOutTime: time, checkOutPhoto: driveUrl, isEarlyLogout: isEarlyLogout(time) }); }
        showToast('✅ Checked out!');
    } else if (type === 'lunch') {
        const snap = await db.collection('attendance').where('employeeId', '==', currentUser.id).where('date', '==', today).get();
        if (!snap.empty) { await snap.docs[0].ref.update({ lunchPhoto: driveUrl, lunchTime: time }); }
        showToast('✅ Lunch photo uploaded!');
    }
    showEmpDashboard();
}

function genCalendar(records) {
    const y = selectedMonth.getFullYear(), m = selectedMonth.getMonth();
    const firstDay = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), today = new Date();
    let html = '';
    for (let i = 0; i < firstDay; i++) html += '<div></div>';
    for (let d = 1; d <= days; d++) {
        const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const rec = records.find(r => r.date === ds);
        const isToday = today.getDate() === d && today.getMonth() === m && today.getFullYear() === y;
        let cls = 'cal-future', txt = d;
        if (rec) {
            const h = calcHours(rec.checkInTime, rec.checkOutTime);
            if (rec.status === 'leave') { cls = 'cal-leave'; txt = 'L'; }
            else if (rec.checkInTime && rec.checkOutTime) {
                if (h >= 8.5) { cls = 'cal-present'; txt = 'P'; }
                else if (h >= 4.5) { cls = 'cal-half'; txt = parseInt(rec.checkInTime.split(':')[0]) < 12 ? 'P:A' : 'A:P'; }
                else { cls = 'cal-absent'; txt = 'A'; }
            } else if (rec.checkInTime) { cls = 'cal-half'; txt = 'P:A'; }
            else { cls = 'cal-absent'; txt = 'A'; }
        } else if (new Date(ds) > today) { cls = 'cal-future'; }
        else { cls = 'cal-absent'; txt = 'A'; }
        html += `<div class="cal-day ${cls} ${isToday ? 'cal-today' : ''}">${txt}</div>`;
    }
    return html;
}

function changeMonth(d) { selectedMonth = new Date(selectedMonth.getFullYear(), selectedMonth.getMonth() + d, 1); showEmpDashboard(); }

async function showTopPerformers() {

        setTitle('Top Performers');

    const attSnap = await db.collection('attendance').where('date', '>=', monthStart).get();
    const attMap = {}; attSnap.forEach(d => { const data = d.data(); if (!attMap[data.employeeId]) attMap[data.employeeId] = []; attMap[data.employeeId].push(data); });
    const performers = employees.map(emp => {
        const recs = attMap[emp.id] || [];
        const present = recs.filter(r => calcHours(r.checkInTime, r.checkOutTime) >= 8.5).length;
        const late = recs.filter(r => r.isLate).length;
        const early = recs.filter(r => r.isEarlyLogout).length;
        const longB = recs.filter(r => (r.breakDuration || 0) > 1).length;
        const ot = recs.reduce((s, r) => { const h = calcHours(r.checkInTime, r.checkOutTime); return s + (h > 9 ? h - 9 : 0); }, 0);
        let score = 100 - (late * 5) - (early * 5) - (longB * 3);
        score = Math.max(score, 0);
        return { ...emp, present, late, early, longB, ot, score };
    }).sort((a, b) => b.score - a.score);
    
    main.innerHTML = `<div class="card"><div class="card-header"><span class="card-title">🏆 Top Performers - ${now.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</span></div></div>` +
        performers.map((emp, i) => `<div class="card" style="${i === 0 ? 'border:2px solid #f59e0b;' : ''}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;"><div style="display:flex;align-items:center;gap:15px;"><div style="width:50px;height:50px;border-radius:50%;background:${i === 0 ? '#f59e0b' : i === 1 ? '#94a3b8' : i === 2 ? '#b45309' : '#e2e8f0'};display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:white;">${i + 1}</div><div><h3>${emp.name}</h3><span class="badge badge-present">Score: ${emp.score}/100</span></div></div>${i === 0 ? '🏆' : i === 1 ? '🥈' : i === 2 ? '🥉' : ''}</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;"><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px;"><div style="font-size:18px;font-weight:800;color:#10b981;">${emp.present}</div><div style="font-size:10px;">Present</div></div><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px;"><div style="font-size:18px;font-weight:800;color:#ef4444;">${emp.late}</div><div style="font-size:10px;">Late</div></div><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px;"><div style="font-size:18px;font-weight:800;color:#f59e0b;">${emp.early}</div><div style="font-size:10px;">Early</div></div><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px;"><div style="font-size:18px;font-weight:800;color:#3b82f6;">${emp.ot.toFixed(1)}h</div><div style="font-size:10px;">OT</div></div><div style="text-align:center;padding:10px;background:var(--bg);border-radius:8px;"><div style="font-size:18px;font-weight:800;color:#8b5cf6;">${emp.longB}</div><div style="font-size:10px;">Break</div></div></div></div>`).join('');
    } catch (e) { renderError(e, 'showTopPerformers'); }

}

// ==================== SALARY REPORT ====================
async function showSalaryReport(period) {
    try {
        setTitle('Salary Report');
    const main = document.getElementById('mainContent');
    const now = new Date(); let startDate;
    if (period === 'daily') startDate = now.toISOString().split('T')[0];
    else if (period === 'weekly') startDate = new Date(now.getTime() - 7 * 86400000).toISOString().split('T')[0];
    else if (period === 'monthly') startDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    else startDate = new Date(now.getFullYear(), 0, 1).toISOString().split('T')[0];
    
    const empSnap = await db.collection('employees').get();
    const employees = []; empSnap.forEach(d => { const e = d.data(); if (e.role !== 'owner') employees.push({ id: d.id, ...e }); });
    const salaryData = [];
    for (const emp of employees) {
        const attSnap = await db.collection('attendance').where('employeeId', '==', emp.id).where('date', '>=', startDate).get();
        const recs = []; attSnap.forEach(d => recs.push(d.data()));
        const present = recs.filter(r => calcHours(r.checkInTime, r.checkOutTime) >= 8.5).length;
        const half = recs.filter(r => { const h = calcHours(r.checkInTime, r.checkOutTime); return h >= 4.5 && h < 8.5; }).length;
        const ot = recs.reduce((s, r) => { const h = calcHours(r.checkInTime, r.checkOutTime); return s + (h > 9 ? h - 9 : 0); }, 0);
        let base, total;
        if (emp.salaryType === 'daily') { base = present * emp.salary + half * (emp.salary / 2); }
        else if (emp.salaryType === 'weekly') { base = emp.salary; }
        else { base = emp.salary; }
        total = base + ot * (emp.salary / 54);
        salaryData.push({ ...emp, present, half, ot, base, total });
    }
    salaryData.sort((a, b) => b.total - a.total);
    const totalPayroll = salaryData.reduce((s, d) => s + d.total, 0);
    
    main.innerHTML = `<div class="card"><div class="card-header"><span class="card-title">💰 Salary Report - ${period.toUpperCase()}</span></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-icon">💰</div><div class="stat-value" style="color:#10b981;">₹${totalPayroll.toFixed(2)}</div><div class="stat-label">Total Payroll</div></div><div class="stat-card"><div class="stat-icon">👥</div><div class="stat-value">${employees.length}</div><div class="stat-label">Staff</div></div></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Employee</th><th>Type</th><th>Present</th><th>Half</th><th>OT</th><th>Base</th><th>Total</th></tr></thead><tbody>${salaryData.map(d => `<tr><td><strong>${d.name}</strong></td><td>${d.salaryType}</td><td>${d.present}</td><td>${d.half}</td><td>${d.ot.toFixed(1)}h</td><td>₹${d.base.toFixed(2)}</td><td><strong>₹${d.total.toFixed(2)}</strong></td></tr>`).join('')}</tbody></table></div></div>`;
    } catch (e) { renderError(e, 'showSalaryReport'); }

}

async function showPhotoAudit(dateStr) {
    try {
        setTitle('Photo Audit');

    main.innerHTML = `<div class="card"><div class="card-header"><span class="card-title">📸 Photo Audit ${viewDate === today ? '(Today)' : ''}</span><input type="date" class="form-input" style="width:auto;padding:8px 10px;" value="${viewDate}" max="${today}" onchange="showPhotoAudit(this.value)"></div><p style="font-size:13px;color:var(--text-secondary);">✅ Photos captured: ${shots.length} &nbsp;|&nbsp; ❌ Missing check-in: ${missingCheckIn.length} &nbsp;|&nbsp; ❌ Missing check-out: ${missingCheckOut.length}</p></div>${(missingCheckIn.length || missingCheckOut.length) ? `<div class="card"><div class="card-header"><span class="card-title">⚠️ Missing Photos</span></div>${missingCheckIn.map(r => `<div style="padding:10px;background:rgba(220,38,38,0.08);border-radius:8px;margin-bottom:8px;"><strong>${r.employeeName}</strong> — missing check-in photo</div>`).join('')}${missingCheckOut.map(r => `<div style="padding:10px;background:rgba(217,119,6,0.08);border-radius:8px;margin-bottom:8px;"><strong>${r.employeeName}</strong> — missing check-out photo</div>`).join('')}</div>` : ''}<div class="card"><div class="card-header"><span class="card-title">📸 Gallery — ${viewDate}</span></div>${shots.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;">${shots.map(s => `<div style="text-align:center;"><img src="${s.url}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;cursor:pointer;" onclick="viewPhoto('${s.url}')"><div style="font-size:12px;font-weight:600;margin-top:4px;">${s.name}</div><div style="font-size:10px;color:var(--text-secondary);">${s.label}${s.time ? ' · ' + s.time : ''}</div></div>`).join('')}</div>` : '<p style="color:var(--text-secondary);">No photos for this date</p>'}</div>`;

async function showSalaryCalc() {
    try {
        setTitle('Salary Calculator');
    const main = document.getElementById('mainContent');
    const snap = await db.collection('employees').get();
    const employees = []; snap.forEach(d => { const e = d.data(); if (e.role === 'employee') employees.push({ id: d.id, ...e }); });

    } catch (e) { renderError(e, 'showSalaryCalc'); }

async function calcSalary() {
    const empSel = document.getElementById('salEmp'), period = document.getElementById('salPeriod').value;
    if (!empSel.value) return;
    const empId = empSel.value, empName = empSel.options[empSel.selectedIndex].dataset.name, dailyRate = parseInt(empSel.options[empSel.selectedIndex].dataset.salary);
    const now = new Date(); let startDate;
    if (period === 'daily') startDate = new Date(now).toISOString().split('T')[0];
    else if (period === 'weekly') startDate = new Date(now.getTime() - 7 * 86400000).toISOString().split('T')[0];
    else startDate = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    const snap = await db.collection('attendance').where('employeeId', '==', empId).where('date', '>=', startDate).get();
    const recs = []; snap.forEach(d => recs.push(d.data()));
    const presentDays = recs.filter(r => calcHours(r.checkInTime, r.checkOutTime) >= 8.5).length;
    const halfDays = recs.filter(r => { const h = calcHours(r.checkInTime, r.checkOutTime); return h >= 4.5 && h < 8.5; }).length;
    const otHours = recs.reduce((s, r) => { const h = calcHours(r.checkInTime, r.checkOutTime); return s + (h > 9 ? h - 9 : 0); }, 0);
    const total = presentDays * dailyRate + halfDays * (dailyRate / 2) + otHours * (dailyRate / 9);
    document.getElementById('salResult').style.display = 'block';
    document.getElementById('salDetails').innerHTML = `<h3>${empName}</h3><p>Present: ${presentDays} × ₹${dailyRate} = ₹${presentDays * dailyRate}</p><p>Half: ${halfDays} × ₹${dailyRate / 2} = ₹${halfDays * (dailyRate / 2)}</p><p>OT: ${otHours.toFixed(1)}h = ₹${(otHours * (dailyRate / 9)).toFixed(2)}</p><hr><h2 style="color:#10b981;">Total: ₹${total.toFixed(2)}</h2>`;
}
