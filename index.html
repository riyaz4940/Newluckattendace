<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>NEWLUCK HRMS</title>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#4f46e5;--primary2:#8b5cf6;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;--bg:#f8fafc;--surface:#fff;--text:#0f172a;--text2:#64748b;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08);--shadowLg:0 10px 40px rgba(0,0,0,.1);--radius:16px}
[data-theme=dark]{--primary:#818cf8;--bg:#0f172a;--surface:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);--shadowLg:0 10px 40px rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent;transition:background .3s}
.splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#4f46e5,#8b5cf6);display:flex;align-items:center;justify-content:center;animation:fadeOut .6s ease 2s forwards}
.splash-inner{text-align:center;color:#fff}
.splash-icon{font-size:80px;animation:pulse 1.5s infinite}
.splash-title{font-size:30px;font-weight:900;margin:20px 0 6px;letter-spacing:1px}
.splash-sub{font-size:14px;opacity:.9}
.splash-loader{width:50px;height:5px;background:rgba(255,255,255,.3);border-radius:3px;margin:30px auto 0;overflow:hidden}
.splash-loader::after{content:'';display:block;width:50%;height:100%;background:#fff;animation:load 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
@keyframes fadeOut{to{opacity:0;visibility:hidden}}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#4f46e5,#8b5cf6)}
.login-card{background:var(--surface);border-radius:24px;padding:40px 35px;max-width:420px;width:100%;box-shadow:var(--shadowLg)}
.login-logo{width:80px;height:80px;margin:0 auto 25px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff}
.login-title{text-align:center;font-size:24px;font-weight:800;margin-bottom:6px}
.login-sub{text-align:center;color:var(--text2);font-size:14px;margin-bottom:30px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.form-input{width:100%;padding:14px;border:2px solid var(--border);border-radius:12px;font-size:15px;font-family:inherit;background:var(--bg);color:var(--text);transition:border-color .2s}
.form-input:focus{outline:none;border-color:var(--primary)}
textarea.form-input{resize:vertical;min-height:80px}
.login-btn{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.login-hint{text-align:center;font-size:12px;color:var(--text2);margin-top:15px;line-height:1.6}
.app{display:none;min-height:100vh}
.app.active{display:block}
.header{background:var(--surface);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);border-bottom:1px solid var(--border)}
.header-left{display:flex;align-items:center;gap:12px}
.hamburger{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text);padding:4px}
.header-title{font-size:17px;font-weight:700}
.header-right{display:flex;align-items:center;gap:10px}
.icon-btn{background:var(--bg);border:1px solid var(--border);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:18px;color:var(--text);position:relative;display:flex;align-items:center;justify-content:center}
.badge-dot{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.logout-btn{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid var(--danger);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}
.sidebar{position:fixed;top:0;left:-300px;width:300px;height:100%;background:var(--surface);z-index:200;transition:left .3s;box-shadow:var(--shadowLg);overflow-y:auto}
.sidebar.active{left:0}
.sidebar-header{background:linear-gradient(135deg,#4f46e5,#8b5cf6);padding:30px 20px;text-align:center;color:#fff}
.sidebar-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;border:2px solid #fff}
.sidebar-name{font-size:17px;font-weight:700}
.sidebar-role{font-size:12px;opacity:.85;margin-top:3px}
.sidebar-menu{padding:15px 0;list-style:none}
.menu-item{padding:13px 20px;margin:2px 10px;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:12px;font-size:14px;font-weight:500;color:var(--text2);transition:all .2s}
.menu-item:hover{background:var(--bg)}
.menu-item.active{background:linear-gradient(135deg,#4f46e5,#8b5cf6);color:#fff}
.menu-icon{width:24px;text-align:center;font-size:17px}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;display:none}
.sidebar-overlay.active{display:block}
.main{padding:18px;padding-bottom:100px;max-width:1100px;margin:0 auto}
.hero{background:linear-gradient(135deg,#4f46e5,#8b5cf6);border-radius:20px;padding:24px;margin-bottom:20px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:200px;height:200px;background:rgba(255,255,255,.08);border-radius:50%;top:-80px;right:-60px}
.hero-title{font-size:22px;font-weight:800;margin-bottom:4px}
.hero-sub{font-size:13px;opacity:.9}
.hero-time{font-size:36px;font-weight:900;margin-top:12px;letter-spacing:-1px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:14px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .2s}
.stat-card:hover{transform:translateY(-2px)}
.stat-icon{font-size:22px;margin-bottom:8px}
.stat-value{font-size:22px;font-weight:800;line-height:1.2}
.stat-label{font-size:11px;color:var(--text2);font-weight:500;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.card{background:var(--surface);border-radius:14px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:16px;font-weight:700}
.btn{padding:11px 18px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-info{background:var(--info);color:#fff}
.btn-primary{background:linear-gradient(135deg,#4f46e5,#8b5cf6);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-block{width:100%;padding:14px;font-size:15px}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}
.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.action-btn{padding:20px 12px;border:none;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s;color:#fff}
.action-btn:active{transform:scale(.96)}
.action-btn:disabled{opacity:.45;cursor:not-allowed}
.action-btn .ai{font-size:26px}
.act-checkin{background:linear-gradient(135deg,#10b981,#059669)}
.act-lunch{background:linear-gradient(135deg,#f59e0b,#d97706)}
.act-checkout{background:linear-gradient(135deg,#ef4444,#dc2626)}
.act-leave{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.act-salary{background:linear-gradient(135deg,#8b5cf6,#7c3aed)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-present{background:rgba(16,185,129,.15);color:#10b981}
.badge-absent{background:rgba(239,68,68,.15);color:#ef4444}
.badge-pending{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-emergency{background:#ef4444;color:#fff}
.badge-half{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-leave{background:rgba(59,130,246,.15);color:#3b82f6}
.badge-late{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-lunch{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-wo{background:rgba(100,116,139,.15);color:#64748b}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:500px}
th{background:var(--bg);padding:11px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--border);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-week{text-align:center;font-size:11px;font-weight:700;color:var(--text2);padding:8px 0;text-transform:uppercase}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;transition:transform .15s;position:relative}
.cal-day:hover{transform:scale(1.08)}
.cal-present{background:rgba(16,185,129,.2);color:#10b981}
.cal-absent{background:rgba(239,68,68,.2);color:#ef4444}
.cal-half{background:rgba(245,158,11,.2);color:#f59e0b}
.cal-leave{background:rgba(59,130,246,.2);color:#3b82f6}
.cal-wo{background:rgba(100,116,139,.15);color:#64748b}
.cal-holiday{background:rgba(139,92,246,.2);color:#8b5cf6}
.cal-future{background:var(--bg);color:var(--text2)}
.cal-today{border:2px solid var(--primary)}
.photo-thumb{width:50px;height:50px;border-radius:8px;cursor:pointer;object-fit:cover;border:1px solid var(--border)}
.photo-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;align-items:center;justify-content:center;padding:20px}
.photo-modal.active{display:flex}
.photo-modal img{max-width:95%;max-height:90%;border-radius:12px}
.photo-modal .close-x{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.2);color:#fff;border:none;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer}
.camera-container{background:#000;border-radius:14px;overflow:hidden;margin-bottom:14px}
.camera-container video{width:100%;max-height:420px;object-fit:cover;display:block}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:14px 22px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;display:none;box-shadow:var(--shadowLg);max-width:92%;border:1px solid var(--border);text-align:center}
.toast.show{display:block;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);gap:10px}
.list-item:last-child{border-bottom:none}
.list-item-name{font-weight:600;font-size:14px}
.list-item-sub{font-size:12px;color:var(--text2);margin-top:2px}
.empty-state{text-align:center;padding:30px 20px;color:var(--text2)}
.empty-state .ei{font-size:48px;margin-bottom:10px;opacity:.6}
.switch-tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px;gap:4px}
.switch-tab{flex:1;padding:11px;text-align:center;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;border:none;background:transparent;color:var(--text2);font-family:inherit}
.switch-tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:350;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.modal.active{display:flex}
.modal-content{background:var(--surface);border-radius:18px;padding:24px;max-width:520px;width:100%;box-shadow:var(--shadowLg);max-height:92vh;overflow-y:auto;margin:auto}
.modal-title{font-size:19px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:var(--text2)}
@media(min-width:768px){.sidebar{left:0}.app{margin-left:300px}.hamburger{display:none}.main{padding:28px}}
</style>
</head>
<body>

<div class="splash" id="splash"><div class="splash-inner"><div class="splash-icon">🏢</div><div class="splash-title">NEWLUCK HRMS</div><div class="splash-sub">Professional HR Management</div><div class="splash-loader"></div></div></div>

<div class="login-screen" id="loginScreen">
    <div class="login-card">
        <div class="login-logo">🏢</div>
        <div class="login-title">NEWLUCK HRMS</div>
        <div class="login-sub">Sign in to continue</div>
        <form id="loginForm">
            <div class="form-group"><label class="form-label">Username</label><input type="text" class="form-input" id="username" required autocomplete="username"></div>
            <div class="form-group"><label class="form-label">Password</label><input type="password" class="form-input" id="password" required autocomplete="current-password"></div>
            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>
        <div class="login-hint">Owner: owner/owner123 · HR: hr/admin · Emp: emp1/1234</div>
    </div>
</div>

<div class="app" id="app">
    <div class="header">
        <div class="header-left">
            <button class="hamburger" onclick="toggleSidebar()">☰</button>
            <span class="header-title" id="pageTitle">Dashboard</span>
        </div>
        <div class="header-right">
            <button class="icon-btn" onclick="showNotifications()" title="Notifications">🔔<span class="badge-dot" id="notifBadge" style="display:none">0</span></button>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar(false)"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-avatar" id="avatar">U</div>
            <div class="sidebar-name" id="userName">User</div>
            <div class="sidebar-role" id="userRole">Role</div>
        </div>
        <ul class="sidebar-menu" id="menu"></ul>
    </div>
    <div class="main" id="mainContent"></div>
</div>

<div class="toast" id="toast"></div>
<div class="photo-modal" id="photoModal"><button class="close-x" onclick="document.getElementById('photoModal').classList.remove('active')">✕</button><img id="photoModalImg" src=""></div>
<div class="modal" id="detailModal"><div class="modal-content" id="detailModalContent"></div></div>
<input type="file" id="photoInput" accept="image/*" capture="user" style="display:none">
<input type="file" id="galleryInput" accept="image/*" style="display:none">

<script>
// ============ FIREBASE CONFIG (KEEP EXISTING) ============
const firebaseConfig = {
    apiKey: "AIzaSyCNOriYLY3suu4IWocqVmlMoSpIGPwqPwk",
    authDomain: "newluckattendace.firebaseapp.com",
    projectId: "newluckattendace",
    storageBucket: "newluckattendace.firebasestorage.app",
    messagingSenderId: "749927661938",
    appId: "1:749927661938:web:44e8b2a273c428c630ddeb"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4BkhWgaP7QUyOuwCACKvwitm3wLZ_hAdcTbuSjqM7FUBZutr0iEEipWX8c1UWzqvf/exec";

// ============ GLOBAL STATE ============
let currentUser = null;
let currentSettings = null;
let selectedMonth = new Date();
let mediaStream = null;
let photoAction = null;
let employeeFilter = 'present';

const DEFAULT_SETTINGS = {
    fullDayHours: 9,
    halfDayHours: 4.5,
    lateAfter: "10:30",
    earlyLogout: "19:00",
    lunchDuration: 60,
    overtimeAfter: 9,
    weeklyOff: 0,
    topPerformer: { punctuality: 40, discipline: 20, avgHours: 20, extra: 10, compliance: 10, minAvgHours: 9, maxLeaves: 5, minAttendance: 95 }
};

// ============ THEME ============
function toggleTheme(){
    const b=document.body,btn=document.getElementById('themeBtn');
    if(b.getAttribute('data-theme')==='dark'){b.removeAttribute('data-theme');btn.textContent='🌙';localStorage.setItem('theme','light')}
    else{b.setAttribute('data-theme','dark');btn.textContent='☀️';localStorage.setItem('theme','dark')}
}
if(localStorage.getItem('theme')==='dark')document.body.setAttribute('data-theme','dark');

// ============ LOGIN ============
document.getElementById('loginForm').addEventListener('submit', handleLogin);
document.addEventListener('DOMContentLoaded', init);

async function init(){
    try{
        const s = await db.collection('settings').doc('global').get();
        currentSettings = s.exists ? {...DEFAULT_SETTINGS, ...s.data()} : DEFAULT_SETTINGS;
        if(!s.exists) await db.collection('settings').doc('global').set(DEFAULT_SETTINGS).catch(()=>{});
    }catch(e){currentSettings=DEFAULT_SETTINGS}
    const saved=localStorage.getItem('currentUser');
    if(saved){currentUser=JSON.parse(saved);showApp()}
}

async function handleLogin(e){
    e.preventDefault();
    const u=document.getElementById('username').value.trim();
    const p=document.getElementById('password').value;
    const btn=document.getElementById('loginBtn');
    btn.disabled=true;btn.textContent='Signing in...';
    if(u==='owner'&&p==='owner123'){
        currentUser={id:'owner001',name:'Business Owner',username:'owner',role:'owner',salary:0,phone:''};
        localStorage.setItem('currentUser',JSON.stringify(currentUser));showApp();btn.disabled=false;btn.textContent='Sign In';return;
    }
    try{
        const snap=await db.collection('employees').get();
        let found=null;
        snap.forEach(doc=>{const emp=doc.data();if(emp.username===u&&emp.password===p)found={id:doc.id,...emp}});
        if(found){currentUser=found;localStorage.setItem('currentUser',JSON.stringify(currentUser));showApp()}
        else showToast('❌ Invalid username or password');
    }catch(err){console.error(err);showToast('❌ Login error. Check connection.')}
    btn.disabled=false;btn.textContent='Sign In';
}

function showApp(){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').classList.add('active');
    document.getElementById('avatar').textContent=currentUser.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('userName').textContent=currentUser.name;
    document.getElementById('userRole').textContent=currentUser.role==='owner'?'Owner':currentUser.role==='hr'?'HR Manager':'Employee';
    buildMenu();
    if(currentUser.role==='owner'||currentUser.role==='hr')showHRDashboard();
    else showEmpDashboard();
    if(currentUser.role==='hr'||currentUser.role==='owner') startHRNotifications();
}

function buildMenu(){
    const m=document.getElementById('menu');
    if(currentUser.role==='hr'||currentUser.role==='owner'){
        m.innerHTML=`
            <li class="menu-item active" onclick="showHRDashboard()"><span class="menu-icon">🏠</span> HR Dashboard</li>
            <li class="menu-item" onclick="showEmployees()"><span class="menu-icon">👥</span> Employees</li>
            <li class="menu-item" onclick="showTodayAttendance()"><span class="menu-icon">🕐</span> Today's Attendance</li>
            <li class="menu-item" onclick="showPhotoAudit()"><span class="menu-icon">📸</span> Photo Audit</li>
            <li class="menu-item" onclick="showLeaveRequestsHR()"><span class="menu-icon">🏖</span> Leave Requests</li>
            <li class="menu-item" onclick="showSalaryCalculator()"><span class="menu-icon">💰</span> Salary Calculator</li>
            <li class="menu-item" onclick="showTopPerformers()"><span class="menu-icon">🏆</span> Top Performers</li>
            <li class="menu-item" onclick="showReports()"><span class="menu-icon">📊</span> Monthly Reports</li>
            <li class="menu-item" onclick="showNotifications()"><span class="menu-icon">🔔</span> Notifications</li>
            <li class="menu-item" onclick="showHRSettings()"><span class="menu-icon">⚙️</span> HR Settings</li>`;
    }else{
        m.innerHTML=`
            <li class="menu-item active" onclick="showEmpDashboard()"><span class="menu-icon">🏠</span> My Dashboard</li>
            <li class="menu-item" onclick="showMyAttendance()"><span class="menu-icon">🕐</span> My Attendance</li>
            <li class="menu-item" onclick="showMyCalendar()"><span class="menu-icon">📅</span> My Calendar</li>
            <li class="menu-item" onclick="showMyBreaks()"><span class="menu-icon">🍱</span> My Breaks</li>

// ============ UTILITIES ============
function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(window._toastT);
    window._toastT=setTimeout(()=>t.classList.remove('show'),3200);
}
function viewPhoto(url){
    if(!url)return showToast('No photo');
    document.getElementById('photoModalImg').src=url;
    document.getElementById('photoModal').classList.add('active');
}
function callEmp(phone){
    if(!phone)return showToast('No phone number');
    window.location.href='tel:'+phone;
}
function fmt(t){return t||'-'}
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function monthStart(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`}
function calcHours(a,b){
    if(!a||!b)return 0;
    const ref=new Date().toDateString();
    const t1=new Date(ref+' '+a), t2=new Date(ref+' '+b);
    let diff=(t2-t1)/60000;
    if(diff<0)diff+=1440;
    return diff;
}
function hoursToHMS(min){
    if(!min||min<0)return '0h 0m';
    const h=Math.floor(min/60),m=Math.round(min%60);
    return `${h}h ${m}m`;
}
function isLate(time){
    if(!time||!currentSettings)return false;
    return new Date('2000-01-01 '+time)>new Date('2000-01-01 '+currentSettings.lateAfter);
}
function isEarly(time){
    if(!time||!currentSettings)return false;
    return new Date('2000-01-01 '+time)<new Date('2000-01-01 '+currentSettings.earlyLogout);
}
function niceDate(d){
    return new Date(d).toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

async function openCamera(type){
    photoAction=type;

    const label={checkin:'Check In',checkout:'Check Out'}[type]||type;
    main.innerHTML=`<div class="card">
        <div class="card-header"><span class="card-title">📸 ${label} Photo</span>

        <div class="camera-container"><video id="videoElement" autoplay playsinline muted></video></div>
        <button class="btn btn-success btn-block" style="margin-bottom:10px" onclick="capturePhoto()">📸 Capture Photo</button>
        <button class="btn btn-info btn-block" onclick="openGallery()">🖼️ Choose from Gallery</button>
        <p style="text-align:center;font-size:12px;color:var(--text2);margin-top:12px">Photo is mandatory for attendance</p>
    </div>`;
    try{
        mediaStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});
        document.getElementById('videoElement').srcObject=mediaStream;

function openGallery(){
    const inp=document.getElementById('galleryInput');
    inp.value='';
    inp.onchange=async function(e){
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=async function(ev){await completePhotoAction(ev.target.result)};
        reader.readAsDataURL(file);
    };
    inp.click();
}

async function capturePhoto(){
    const video=document.getElementById('videoElement');
    if(!video||!video.videoWidth){showToast('Camera not ready');return}
    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0);
    const photoData=canvas.toDataURL('image/jpeg',0.75);
    if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null}
    await completePhotoAction(photoData);
}

async function uploadToDrive(photoData,type){
    try{
        const base64=photoData.split(',')[1];
        const res=await fetch(APPS_SCRIPT_URL,{
            method:'POST',
            headers:{'Content-Type':'text/plain;charset=utf-8'},
            body:JSON.stringify({photo:base64,employeeId:currentUser.id,employeeName:currentUser.name,photoType:type,attendanceDate:todayStr(),mimeType:'image/jpeg'})
        });
        const json=await res.json();
        if(json.success)return json.data;
        return null;
    }catch(e){console.warn('Drive upload failed',e);return null}
}

async function completePhotoAction(photoData){
    const type=photoAction;
    const today=todayStr();
    const now=new Date();
    const time=now.toLocaleTimeString('en-US',{hour12:false});
    showToast('Uploading photo...');
    const drive=await uploadToDrive(photoData,type);
    const photoUrl=(drive&&(drive.viewUrl||drive.fileUrl))||photoData;
    const driveId=(drive&&drive.fileId)||null;

    try{
        const ref=db.collection('attendance').doc(`${currentUser.id}_${today}`);
        const snap=await ref.get();
        const data=snap.exists?snap.data():{};

        if(type==='checkin'){
            if(data.checkInTime){showToast('Already checked in');return showEmpDashboard()}
            await ref.set({
                attendanceId:`${currentUser.id}_${today}`,
                employeeId:currentUser.id,
                employeeName:currentUser.name,
                date:today,
                checkInTime:time,
                checkInPhoto:photoUrl,
                checkInDriveFileId:driveId,
                status:'present',
                lateMinutes:isLate(time)?Math.round((new Date('2000-01-01 '+time)-new Date('2000-01-01 '+currentSettings.lateAfter))/60000):0,
                isLate:isLate(time),
                photoVerificationStatus:'pending',
                createdAt:firebase.firestore.FieldValue.serverTimestamp(),
                updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            },{merge:true});
            await db.collection('attendance_events').add({employeeId:currentUser.id,employeeName:currentUser.name,date:today,type:'checkin',time,ts:now.getTime()}).catch(()=>{});
            showToast(isLate(time)?'⚠️ Late check-in recorded':'✅ Checked in successfully');
        }else if(type==='checkout'){
            if(!data.checkInTime){showToast('Check in first');return showEmpDashboard()}
            if(data.checkOutTime){showToast('Already checked out');return showEmpDashboard()}
            const workMin=calcHours(data.checkInTime,time);
            const lunchMin=data.lunchDuration||0;
            const netMin=Math.max(workMin-lunchMin,0);
            const otMin=Math.max(netMin-currentSettings.overtimeAfter*60,0);
            await ref.update({
                checkOutTime:time,checkOutPhoto:photoUrl,checkOutDriveFileId:driveId,
                workingMinutes:netMin,workingHours:(netMin/60).toFixed(2),
                overtimeMinutes:otMin,overtime:(otMin/60).toFixed(2),
                isEarlyLogout:isEarly(time),
                earlyLogoutMinutes:isEarly(time)?Math.round((new Date('2000-01-01 '+currentSettings.earlyLogout)-new Date('2000-01-01 '+time))/60000):0,
                updatedAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            await db.collection('attendance_events').add({employeeId:currentUser.id,employeeName:currentUser.name,date:today,type:'checkout',time,ts:now.getTime()}).catch(()=>{});
            showToast('✅ Checked out. Hours: '+hoursToHMS(netMin));
        }
    }catch(e){console.error(e);showToast('❌ Save error: '+e.message)}
    showEmpDashboard();
}

async function endLunch(){

    const time=new Date().toLocaleTimeString('en-US',{hour12:false});

    showEmpDashboard();
}

async function submitLeave(){
    const type=document.getElementById('leaveType').value;

    const reason=document.getElementById('leaveReason').value.trim();
    if(!from||!to||!reason)return showToast('Fill all fields');

    try{
        await db.collection('leave_requests').add({
            employeeId:currentUser.id,employeeName:currentUser.name,
            leaveType:type,from,to,reason,status:'pending',
            isEmergency:type==='Emergency Leave',
            appliedAt:new Date().toISOString(),ts:Date.now()
        });
        await db.collection('notifications').add({
            for:'hr',type:'leave_request',employeeId:currentUser.id,employeeName:currentUser.name,
            message:`${currentUser.name} applied ${type} (${from} → ${to})`,
            date:todayStr(),read:false,ts:Date.now()
        }).catch(()=>{});
        showToast('✅ Leave submitted');
        showLeaveForm();
    }catch(e){showToast('Error: '+e.message)}
}

// ============ CALENDAR RENDER ============
function renderCalendar(records,forEmployee){
    const y=selectedMonth.getFullYear(),m=selectedMonth.getMonth();
    const firstDay=new Date(y,m,1).getDay();
    const days=new Date(y,m+1,0).getDate();
    const today=new Date();
    let html=`<div class="cal-grid">
        <div class="cal-week">Sun</div><div class="cal-week">Mon</div><div class="cal-week">Tue</div>
        <div class="cal-week">Wed</div><div class="cal-week">Thu</div><div class="cal-week">Fri</div><div class="cal-week">Sat</div>`;
    for(let i=0;i<firstDay;i++)html+='<div></div>';
    for(let d=1;d<=days;d++){
        const ds=`${y}-${pad(m+1)}-${pad(d)}`;
        const rec=records.find(r=>r.date===ds);
        const dayOfWeek=new Date(ds).getDay();
        const isWO=dayOfWeek===currentSettings.weeklyOff;
        const isToday=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
        let cls='cal-future',txt=d;
        if(rec){
            const h=rec.workingMinutes||0;
            if(rec.status==='leave'){cls='cal-leave';txt='L'}
            else if(!rec.checkInTime){cls='cal-absent';txt='A'}
            else if(h>=currentSettings.fullDayHours*60){cls='cal-present';txt='P'}
            else if(h>=currentSettings.halfDayHours*60){cls='cal-half';txt='HD'}
            else{cls='cal-present';txt='P'}
        }else if(isWO){cls='cal-wo';txt='WO'}
        else if(new Date(ds)>today){cls='cal-future'}
        else{cls='cal-absent';txt='A'}
        html+=`<div class="cal-day ${cls} ${isToday?'cal-today':''}" onclick="showDayDetail('${ds}')" title="${ds}">${txt}</div>`;
    }
    html+='</div>';
    return html;
}

function filterPhotoAudit(f,btn){
    document.querySelectorAll('.switch-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    db.collection('attendance').where('date','==',todayStr()).get().then(snap=>{
        const recs=[];snap.forEach(d=>recs.push(d.data()));
        const filtered=f==='all'?recs:recs.filter(r=>(r.photoVerificationStatus||'pending')===f);
        document.getElementById('photoList').innerHTML=renderPhotoCards(filtered);

    try{

async function calcSalary(){
    const empSel=document.getElementById('salEmp');
    if(!empSel.value){document.getElementById('salResult').innerHTML='';return}
    const empId=empSel.value;
    const empName=empSel.options[empSel.selectedIndex].dataset.name;
    const rate=parseInt(empSel.options[empSel.selectedIndex].dataset.salary)||0;
    const salType=empSel.options[empSel.selectedIndex].dataset.type;
    const period=document.getElementById('salPeriod').value;

    const now=new Date();
    let startDate;
    if(period==='daily')startDate=todayStr();
    else if(period==='weekly')startDate=new Date(now.getTime()-7*86400000).toISOString().split('T')[0];
    else startDate=monthStart();

    try{
        // FIX: single-field query + JS filter
        const snap=await db.collection('attendance').where('employeeId','==',empId).get();
        const allRecs=[];snap.forEach(d=>allRecs.push(d.data()));
        const recs=allRecs.filter(r=>r.date>=startDate);

        let present=0,half=0,absent=0,otMin=0;
        recs.forEach(r=>{
            const h=r.workingMinutes||0;otMin+=r.overtimeMinutes||0;
            if(!r.checkInTime){absent++}
            else if(h>=currentSettings.fullDayHours*60)present++;
            else if(h>=currentSettings.halfDayHours*60)half++;
            else present++;
        });

        let base=0,otPay=0;
        if(salType==='daily'){base=present*rate+half*rate/2;otPay=(otMin/60)*(rate/9)}
        else if(salType==='weekly'){base=rate;otPay=(otMin/60)*(rate/54)}
        else{base=rate;otPay=(otMin/60)*(rate/(26*9))}
        const gross=base+otPay;

        document.getElementById('salResult').innerHTML=`
        <div class="card">
            <div class="card-header"><span class="card-title">₹ Salary Breakdown - ${empName}</span>
                <span class="badge badge-present">${period.toUpperCase()}</span></div>
            <div class="list-item"><span>Salary Type</span><strong>${salType.toUpperCase()}</strong></div>
            <div class="list-item"><span>Rate</span><strong>₹${rate}</strong></div>
            <div class="list-item"><span>Present Days</span><strong>${present}</strong></div>
            <div class="list-item"><span>Half Days</span><strong>${half}</strong></div>
            <div class="list-item"><span>Absent Days</span><strong>${absent}</strong></div>
            <div class="list-item"><span>Overtime</span><strong>${hoursToHMS(otMin)}</strong></div>
            <hr style="margin:12px 0;border:none;border-top:1px solid var(--border)">
            <div class="list-item"><span>Base Pay</span><strong>₹${base.toFixed(2)}</strong></div>
            <div class="list-item"><span>Overtime Pay</span><strong>₹${otPay.toFixed(2)}</strong></div>
            <div class="list-item" style="font-size:16px"><span><strong>Gross Salary</strong></span><strong style="color:#10b981">₹${gross.toFixed(2)}</strong></div>
            <button class="btn btn-primary btn-block" style="margin-top:16px" onclick="finalizePayroll('${empId}','${empName}',${gross},${present},${half},${absent},${otMin})">💰 Finalize Payroll</button>
        </div>`;
    }catch(e){document.getElementById('salResult').innerHTML=`<div class="card"><p>Error: ${e.message}</p></div>`}
}

async function finalizePayroll(empId,empName,gross,present,half,absent,otMin){
    if(!confirm(`Finalize payroll for ${empName}?\nGross: ₹${gross.toFixed(2)}`))return;
    try{
        await db.collection('payroll').add({
            employeeId:empId,employeeName:empName,period:document.getElementById('salPeriod').value,
            base:gross, presentDays:present, halfDays:half, absentDays:absent,
            overtimeMinutes:otMin, gross:gross, net:gross,
            processedBy:currentUser.id, processedByName:currentUser.name,
            processedAt:new Date().toISOString(), ts:Date.now()
        });
        await db.collection('notifications').add({
            for:'employee',employeeId:empId,type:'salary_processed',
            message:`Your salary has been processed: ₹${gross.toFixed(2)}`,date:todayStr(),read:false,ts:Date.now()
        }).catch(()=>{});
        showToast('✅ Payroll finalized');
    }catch(e){showToast('Error: '+e.message)}
}

// ============ TOP PERFORMERS (FIXED query) ============
async function calcTopPerformers(){
    const ms=monthStart();
    const empSnap=await db.collection('employees').get();
    const emps=[];empSnap.forEach(d=>{const e=d.data();if(e.role==='employee'&&e.status!=='Inactive')emps.push({id:d.id,...e})});

    // FIX: single-field query (or full fetch) + JS filter
    const attSnap=await db.collection('attendance').get();
    const attMap={};
    attSnap.forEach(d=>{
        const a=d.data();
        if(a.date>=ms){
            if(!attMap[a.employeeId])attMap[a.employeeId]=[];
            attMap[a.employeeId].push(a);
        }
    });

    const result=emps.map(emp=>{
        const recs=attMap[emp.id]||[];
        let present=0,late=0,totalMin=0,otMin=0;
        recs.forEach(r=>{
            const h=r.workingMinutes||0;totalMin+=h;otMin+=r.overtimeMinutes||0;
            if(r.isLate)late++;
            if(r.checkInTime)present++;
        });
        const avgMin=present>0?totalMin/present:0;
        const days=new Date().getDate();
        const attendanceRate=days>0?(present/days)*100:0;
        const punctRate=present>0?((present-late)/present)*100:0;
        const avgHourScore=Math.min(avgMin/(currentSettings.topPerformer.minAvgHours*60),1)*100;
        const attScore=Math.min(attendanceRate/currentSettings.topPerformer.minAttendance,1)*100;
        const otScore=Math.min(otMin/(20*60),1)*100;
        const score=Math.round(
            punctRate*0.4 + attScore*0.2 + avgHourScore*0.2 + otScore*0.1 + attScore*0.1
        );
        return {id:emp.id,name:emp.name,present,late,avgMin,otMin,score,attendanceRate};
    }).sort((a,b)=>b.score-a.score);
    return result;
}

    document.getElementById('pageTitle').textContent='Top Performers';

                let present=0,half=0,absent=0,late=0,totalMin=0,otMin=0;
                recs.forEach(r=>{
                    const h=r.workingMinutes||0;totalMin+=h;otMin+=r.overtimeMinutes||0;
                    if(r.isLate)late++;
                    if(!r.checkInTime)absent++;
                    else if(h>=currentSettings.fullDayHours*60)present++;
                    else if(h>=currentSettings.halfDayHours*60)half++;
                    else present++;
                });
                return `<tr>
                    <td><strong>${e.name}</strong></td>
                    <td><span class="badge badge-present">${present}</span></td>
                    <td><span class="badge badge-half">${half}</span></td>
                    <td><span class="badge badge-absent">${absent}</span></td>
                    <td><span class="badge badge-late">${late}</span></td>
                    <td>${hoursToHMS(totalMin)}</td>
                    <td>${hoursToHMS(otMin)}</td>
                </tr>`;
            }).join('')}
            </tbody></table></div>
        </div>`;
    }catch(e){document.getElementById('mainContent').innerHTML=`<div class="card"><p>Error: ${e.message}</p></div>`}
}

// ============ HR NOTIFICATIONS ============
async function showNotifications(){
    document.getElementById('pageTitle').textContent='Notifications';
    try{
        const snap=await db.collection('notifications').where('for','==','hr').get();
        const recs=[];snap.forEach(d=>recs.push({id:d.id,...d.data()}));
        recs.sort((a,b)=>(b.ts||0)-(a.ts||0));
        for(const r of recs.filter(x=>!x.read)){
            db.collection('notifications').doc(r.id).update({read:true}).catch(()=>{});
        }
        document.getElementById('mainContent').innerHTML=`
        <div class="card">
            <div class="card-header"><span class="card-title">🔔 Notifications (${recs.length})</span></div>
            ${recs.length?recs.map(n=>`<div class="list-item" style="${!n.read?'background:rgba(79,70,229,.05);border-radius:8px;padding:12px':''}">
                <div style="flex:1">
                    <div class="list-item-name">${(n.type||'').replace(/_/g,' ').toUpperCase()}</div>
                    <div class="list-item-sub">${n.message||''}</div>
                    <div class="list-item-sub">${n.date||''} ${n.employeeName?'· '+n.employeeName:''}</div>
                </div>
            </div>`).join(''):'<div class="empty-state"><div class="ei">🔔</div>No notifications</div>'}
        </div>`;
    }catch(e){document.getElementById('mainContent').innerHTML=`<div class="card"><p>Error: ${e.message}</p></div>`}
}

// ============ HR SETTINGS ============
async function showHRSettings(){
    document.getElementById('pageTitle').textContent='HR Settings';
    const s=currentSettings;
    document.getElementById('mainContent').innerHTML=`
    <div class="card">
        <div class="card-header"><span class="card-title">⚙️ Attendance Rules</span></div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Full Day Hours</label><input type="number" step="0.5" class="form-input" id="setFull" value="${s.fullDayHours}"></div>
            <div class="form-group"><label class="form-label">Half Day Hours</label><input type="number" step="0.5" class="form-input" id="setHalf" value="${s.halfDayHours}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Late After</label><input type="time" class="form-input" id="setLate" value="${s.lateAfter}"></div>
            <div class="form-group"><label class="form-label">Early Logout</label><input type="time" class="form-input" id="setEarly" value="${s.earlyLogout}"></div>
        </div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Lunch (minutes)</label><input type="number" class="form-input" id="setLunch" value="${s.lunchDuration}"></div>
            <div class="form-group"><label class="form-label">OT After (hours)</label><input type="number" step="0.5" class="form-input" id="setOT" value="${s.overtimeAfter}"></div>
        </div>
        <div class="form-group"><label class="form-label">Weekly Off</label>
            <select class="form-input" id="setWO">
                ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<option value="${i}" ${s.weeklyOff==i?'selected':''}>${d}</option>`).join('')}
            </select>
        </div>
    </div>
    <div class="card">
        <div class="card-header"><span class="card-title">🏆 Top Performer Rules</span></div>
        <div class="form-row">
            <div class="form-group"><label class="form-label">Min Avg Hours</label><input type="number" step="0.5" class="form-input" id="tpAvg" value="${s.topPerformer.minAvgHours}"></div>
            <div class="form-group"><label class="form-label">Max Leaves</label><input type="number" class="form-input" id="tpLeaves" value="${s.topPerformer.maxLeaves}"></div>
        </div>
        <div class="form-group"><label class="form-label">Min Attendance %</label><input type="number" class="form-input" id="tpAtt" value="${s.topPerformer.minAttendance}"></div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveSettings()">💾 Save Settings</button>
    <button class="btn btn-outline btn-block" style="margin-top:10px" onclick="showAuditLog()">📜 View Audit Log</button>`;
}

async function saveSettings(){
    const newS={
        fullDayHours:parseFloat(document.getElementById('setFull').value)||9,
        halfDayHours:parseFloat(document.getElementById('setHalf').value)||4.5,
        lateAfter:document.getElementById('setLate').value||'10:30',
        earlyLogout:document.getElementById('setEarly').value||'19:00',
        lunchDuration:parseInt(document.getElementById('setLunch').value)||60,
        overtimeAfter:parseFloat(document.getElementById('setOT').value)||9,
        weeklyOff:parseInt(document.getElementById('setWO').value)||0,
        topPerformer:{
            ...currentSettings.topPerformer,
            minAvgHours:parseFloat(document.getElementById('tpAvg').value)||9,
            maxLeaves:parseInt(document.getElementById('tpLeaves').value)||5,
            minAttendance:parseFloat(document.getElementById('tpAtt').value)||95
        }
    };
    try{
        await db.collection('settings').doc('global').set(newS,{merge:true});
        currentSettings={...currentSettings,...newS};
        await db.collection('audit_logs').add({action:'settings_updated',by:currentUser.id,newValues:newS,ts:Date.now()}).catch(()=>{});
        showToast('✅ Settings saved');
    }catch(e){showToast('Error: '+e.message)}
}

async function showAuditLog(){
    try{
        const snap=await db.collection('audit_logs').limit(50).get();
        const recs=[];snap.forEach(d=>recs.push(d.data()));
        recs.sort((a,b)=>(b.ts||0)-(a.ts||0));
        document.getElementById('detailModalContent').innerHTML=`
            <div class="modal-title">📜 Audit Log<button class="modal-close" onclick="document.getElementById('detailModal').classList.remove('active')">✕</button></div>
            ${recs.length?recs.map(r=>`<div class="list-item">
                <div><div class="list-item-name">${(r.action||'').replace(/_/g,' ').toUpperCase()}</div>
                <div class="list-item-sub">By: ${r.byName||r.by||'-'}</div>
                <div class="list-item-sub">${new Date(r.ts).toLocaleString()}</div></div>
            </div>`).join(''):'<div class="empty-state">No audit logs</div>'}`;
        document.getElementById('detailModal').classList.add('active');
    }catch(e){showToast('Error: '+e.message)}
}

console.log('✅ NEWLUCK HRMS Loaded Successfully');
</script>
